name: DSH 门禁

# 这个工作流回答一个 CI 里的其他检查回答不了的问题：
# **在真实 DSH 宿主上，这个插件到底装不装得上、有没有被静默禁用。**
#
# 与 `ci.yml`（lint / typecheck / 单测 / 构建）是互补关系，不改动它：
#   - ci.yml        → 代码本身对不对
#   - dsh-gate.yml  → 交付物在宿主上能不能用（声明契约 + 真实启动）
#
# 两条车道，缺一不可：
#   A 静态门禁  读 manifest / peer 范围，秒级，不启动宿主
#   B 激活探针  真实启动一次，看宿主有没有把某一行禁用掉
# 实测依据：`--dump-config` **不跑**兼容性预检 —— 一个 peer 不兼容的行会原样出现在
# 配置 dump 里，既没有 disabled 标记也没有诊断。所以 A 不能替代 B。

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # 每周一 02:00 UTC：上游宿主发新版时，尽早发现"插件在新宿主上被禁用"
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 测试基建仓库（dsh-plugin-testing）**钉死在某个 revision**。
  # 门禁自身也必须可复现：如果它跟着 main 漂移，"同一份插件代码给出不同结论"
  # 会让这个检查失去可信度。升级方式见本文件末尾注释。
  #
  # ⚠️ **内网迁移只需要改下面这一行**（换成内网 GitLab 的 clone 地址）。
  # 取仓库用的是普通 `git clone`，不是 actions/checkout 的 repository:/ref: ——
  # 后者是 GitHub 专有机制，GitLab 上没有对应物。两个仓库都是公开的，所以不需要凭据。
  TESTING_REPO_URL: https://github.com/mofanx/dsh-plugin-testing.git
  TESTING_REV: b22e9d8f3d1cd83cb2e2db0dadf5a7b879af631e
  TESTING_DIR: .dsh-testing
  HOST_DIR: .dsh-host

jobs:
  # ── 必过车道：两条已知宿主线，固定版本，确定性 ────────────────────────────
  dsh-gate:
    name: 宿主 ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          # 桌面线：与用户实际装到的桌面打包宿主同版本（npm dist-tag latest）
          - '0.2.0-rc.2'
          # 源码线：下一版 DSH 的预发布线（npm dist-tag alpha）
          - '0.2.1-alpha.4'
    steps:
      - uses: actions/checkout@v4

      - name: 取测试基建（钉死 revision）
        run: |
          set -euo pipefail
          git clone --no-checkout "$TESTING_REPO_URL" "$TESTING_DIR"
          git -C "$TESTING_DIR" checkout --detach "$TESTING_REV"
          # 回显实际取到的提交：钉错了要当场看出来，而不是等到结论不对时再回头查
          echo "测试基建 revision = $(git -C "$TESTING_DIR" rev-parse HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 探针验证的是**交付物**：插件入口 `lib/index.js` 是 tsc -b 的构建产物，不在
      # 仓库里。不构建就探测针，每一行都会 failed to import 并抛 ERR_MODULE_NOT_FOUND
      # （那句描述的是症状，原因是没人跑构建）—— 这正是首次接入时踩到的坑。
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: 安装工作区依赖
        run: pnpm install --frozen-lockfile

      - name: 构建被测插件
        run: pnpm run build

      - name: 断言构建产物存在（构建失败/漏包时给明确报错）
        run: |
          for dir in packages/*/; do
            node -e "
              const fs = require('fs'), path = require('path');
              const pkg = JSON.parse(fs.readFileSync('$dir/package.json', 'utf8'));
              const entry = (pkg.exports && pkg.exports['.']) ?? pkg.main;
              if (!entry || typeof entry !== 'string') { console.log('跳过（未声明入口）：' + pkg.name); process.exit(0); }
              const target = path.join('$dir', entry);
              if (!fs.existsSync(target)) { console.error('构建产物缺失：' + pkg.name + ' -> ' + target); process.exit(1); }
              console.log('ok: ' + pkg.name + ' -> ' + entry);
            "
          done

      # 宿主直接取 npm 上发布的 @deepseek-ai/dsh —— 它与桌面打包宿主同源同版本，
      # 且是一个**完整安装**（自带 dsh-base / dsh-headless / dsh-app-boot 与
      # stock headless profile），因此 runner 上不需要准备桌面产物。
      #
      # 刻意**不用** `npm init -y`：它从目录名推导包名，而 `.dsh-host` 这种点开头的
      # 名字是非法包名（npm 报 Invalid name），在 CI 上会直接失败。写死一个合法
      # package.json 既不依赖目录名，也让这一步没有隐式行为。
      - name: 安装被测宿主 @deepseek-ai/dsh@${{ matrix.host }}
        run: |
          mkdir -p "$HOST_DIR"
          printf '%s' '{"name":"dsh-host-under-test","private":true,"version":"0.0.0"}' > "$HOST_DIR/package.json"
          npm install --no-audit --no-fund --prefix "$HOST_DIR" "@deepseek-ai/dsh@${{ matrix.host }}"
          test -f "$HOST_DIR/node_modules/@deepseek-ai/dsh/lib/bin.js" \
            || { echo "宿主布局不符合预期：缺少 @deepseek-ai/dsh/lib/bin.js"; exit 1; }
          node -e "const fs=require('fs');console.log('宿主 dsh-app-boot 版本 =', JSON.parse(fs.readFileSync(process.env.HOST_DIR+'/node_modules/@deepseek-ai/dsh-app-boot/package.json','utf8')).version)"

      - name: 安装门禁依赖
        working-directory: ${{ env.TESTING_DIR }}/packages/conformance
        run: npm install --no-audit --no-fund

      # 车道 A：静态门禁。显式传 --host（而不是留空）：门禁把"配置声明的路径不存在"
      # 判为 DSH-C070 error，于是宿主缺失会**硬报错**，而不是静默少查一片。
      - name: 车道 A · 静态门禁
        run: |
          node "$TESTING_DIR/packages/conformance/src/run-all.mjs" \
            --config conformance.json \
            --host "$PWD/$HOST_DIR/node_modules"

      # 车道 B：运行时激活探针。**不需要模型凭据**：兼容性预检在第一次模型调用之前
      # 执行，隔离 home 会稳定终止于 MISSING_CREDENTIAL —— 走到这一步本身就是
      # "启动已越过预检"的证据。
      # 这里刻意**不传** --expect-active：home 是隔离的，所有行都来自本仓库的 bundle
      # 或宿主自身，因此任何一条禁用都应当归因于本次改动并让 CI 变红。
      - name: 车道 B · 运行时激活探针
        run: |
          node "$TESTING_DIR/packages/testkit/src/activate-cli.mjs" \
            --packages "$PWD/packages/*" \
            --bundle @deepseek-ai/dsh-plugin-eda-bundle \
            --launcher "$PWD/$HOST_DIR/node_modules/@deepseek-ai/dsh/lib/bin.js"

      # 车道 C：宿主版本矩阵。**不需要宿主、不需要凭据、不联网**（清单随测试仓库的钉死
      # revision 一起取来），所以它比 A/B 都便宜。
      #
      # 它回答的是 A/B 都回答不了的问题：不是"我手上这个宿主行不行"，而是"我声明的范围
      # **整体**覆盖了哪些已发布版本"。两类缺陷在单宿主视角下结构性不可见：
      #   · 空洞（DSH-C068，error）—— 落在被覆盖区间**之内**却不被接纳的已发布版本，
      #     即"相邻版本都声明支持、中间那版用户却被禁用"；
      #   · 安装期分歧（DSH-C067，warn）—— 运行时接纳但 npm/pnpm 拒绝（预发布元组未覆盖）。
      # 后一类正是 2026-10-16 在 `0.2.1-alpha.1` 上抓到的那个：并集第二子句下界写成
      # alpha.2，静默漏掉 alpha.1，那版用户装不上。加了这条车道，同类问题不会再悄悄回来。
      #
      # 刻意**不加** --strict：与车道 A 一致，warn 不阻断（C067 与 C061 同属 warn 级），
      # 但会打印出来。要让 warn 也阻断，把 --strict 加上即可。
      # 本步与 matrix.host 无关（不装宿主），因此两条宿主线上结果相同 —— 重复执行无害，
      # 换取工作流更简单。
      #
      # --surfaces 追加 T18 交叉核对（DSH-C069，error）：把"声明覆盖了哪些版本"再与
      # "代码真正 import 的包/子路径/具名符号"求交。peer 范围描述的是**声明**，只有插件
      # 自己的 import 描述**需要** —— 一个插件可以满足全部 peer，同时 import 一个已不存在的
      # 符号（0.2.1 线删掉 ./invariant 就是现成的例子）。API 面是随测试仓库提交的静态产物，
      # 所以这一步**不装宿主、不联网、不启动**，可以在每次 PR 上跑。
      # 未记录 API 面的版本一律算"未知"，不算通过 —— 当前记录恰好覆盖本仓库声明区间的全部 5 版。
      - name: 车道 C · 宿主版本矩阵（声明覆盖集 ∩ 代码实际引用的 API）
        run: |
          node "$TESTING_DIR/packages/conformance/src/cli-host-matrix.mjs" \
            "$PWD/packages/"* \
            --candidates "$TESTING_DIR/fixtures/host-versions.published.json" \
            --surfaces "$TESTING_DIR/fixtures/host-surfaces"

  # ── 金丝雀车道：跟 dist-tag 走，只做预警，不阻塞 PR ──────────────────────
  # 目的：上游发新版时**提前**知道插件会不会被禁用，而不是等用户来报。
  # 用 dist-tag 意味着结论会随上游变化 —— 所以它允许失败，且只在定时/手动时跑。
  dsh-canary:
    name: 金丝雀 ${{ matrix.tag }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, alpha]
    steps:
      - uses: actions/checkout@v4

      - name: 取测试基建（钉死 revision）
        run: |
          set -euo pipefail
          git clone --no-checkout "$TESTING_REPO_URL" "$TESTING_DIR"
          git -C "$TESTING_DIR" checkout --detach "$TESTING_REV"
          # 回显实际取到的提交：钉错了要当场看出来，而不是等到结论不对时再回头查
          echo "测试基建 revision = $(git -C "$TESTING_DIR" rev-parse HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 同 dsh-gate：探针验证交付物，入口是构建产物，必须先构建。
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: 安装工作区依赖
        run: pnpm install --frozen-lockfile

      - name: 构建被测插件
        run: pnpm run build

      - name: 安装被测宿主 @deepseek-ai/dsh@${{ matrix.tag }}
        run: |
          mkdir -p "$HOST_DIR"
          printf '%s' '{"name":"dsh-host-canary","private":true,"version":"0.0.0"}' > "$HOST_DIR/package.json"
          npm install --no-audit --no-fund --prefix "$HOST_DIR" "@deepseek-ai/dsh@${{ matrix.tag }}"
          test -f "$HOST_DIR/node_modules/@deepseek-ai/dsh/lib/bin.js" \
            || { echo "宿主布局不符合预期：缺少 @deepseek-ai/dsh/lib/bin.js"; exit 1; }
          node -e "const fs=require('fs');console.log('宿主 dsh-app-boot 版本 =', JSON.parse(fs.readFileSync(process.env.HOST_DIR+'/node_modules/@deepseek-ai/dsh-app-boot/package.json','utf8')).version)"

      - name: 运行时激活探针（预警）
        run: |
          node "$TESTING_DIR/packages/testkit/src/activate-cli.mjs" \
            --packages "$PWD/packages/*" \
            --bundle @deepseek-ai/dsh-plugin-eda-bundle \
            --launcher "$PWD/$HOST_DIR/node_modules/@deepseek-ai/dsh/lib/bin.js"

# ─────────────────────────────────────────────────────────────────────────────
# 升级 TESTING_REV 的方式（门禁规则变更后同步）：
#   1. 在 dsh-plugin-testing 仓库确认目标提交已推送到 main；
#   2. 把上面的 TESTING_REV 换成该提交的完整 SHA；
#   3. 在本仓库开 PR，确认两条车道仍然全绿后合入。
# 不要改成浮动分支（如 main）：门禁自身漂移会让"同一份代码给出不同结论"。
#
# 内网 GitLab 迁移：
#   本文件里只有 `TESTING_REPO_URL` 那一行是环境相关的 —— 取测试基建用的是普通
#   `git clone`，两个平台上跑的是同一条命令。GitHub Actions 专有的部分（actions/*、
#   pnpm/action-setup）需要在 GitLab 上换成对应写法；迁移清单见测试仓库的
#   docs/intranet-porting.md。
#
# 本地复跑（不需要 CI）：
#   pnpm install --frozen-lockfile && pnpm run build   # 必须先构建：探针验证交付物
#   mkdir -p .dsh-host
#   printf '%s' '{"name":"dsh-host-under-test","private":true,"version":"0.0.0"}' > .dsh-host/package.json
#   npm install --no-audit --no-fund --prefix .dsh-host @deepseek-ai/dsh@0.2.0-rc.2
#   node <dsh-plugin-testing>/packages/conformance/src/run-all.mjs \
#            --config conformance.json --host "$PWD/.dsh-host/node_modules"
#   node <dsh-plugin-testing>/packages/testkit/src/activate-cli.mjs \
#            --packages "$PWD/packages/*" --bundle @deepseek-ai/dsh-plugin-eda-bundle \
#            --launcher "$PWD/.dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js"
# 注意：不要用 `npm init -y` 生成 .dsh-host/package.json —— 它从目录名推导包名，
# 而点开头的名字是非法包名，npm 会直接报 Invalid name。
# ─────────────────────────────────────────────────────────────────────────────
